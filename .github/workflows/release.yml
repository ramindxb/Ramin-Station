name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-mode:
    runs-on: ubuntu-latest
    outputs:
      automatic: ${{ steps.mode.outputs.automatic }}
    steps:
      - name: Select signed release publication mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          STATION_UPDATE_PRIVATE_KEY: ${{ secrets.STATION_UPDATE_PRIVATE_KEY }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its signed packages."
            echo "automatic=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$STATION_UPDATE_PRIVATE_KEY" ]]; then
            echo "No Actions signing key configured. Publish locally signed artifacts using app/UPDATES.md."
            echo "automatic=false" >> "$GITHUB_OUTPUT"
          else
            echo "automatic=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: release-mode
    if: needs.release-mode.outputs.automatic == 'true'
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/windows/go.mod
          cache-dependency-path: app/windows/go.sum

      - name: Build macOS packages
        run: zsh app/native/build-macos.sh

      - name: Build Windows packages
        run: zsh app/windows/build-windows.sh

      - name: Generate checksums
        working-directory: dist
        run: |
          version="$(node -p 'require("../app/update-config.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          shasum -a 256 \
            "Ramin-Station-$version-macOS.dmg" \
            "Ramin-Station-$version-macOS.zip" \
            "Ramin-Station-$version-Windows-Setup.exe" \
            "Ramin-Station-$version-Windows-Portable.zip" \
            > SHA256SUMS.txt

      - name: Sign update metadata
        env:
          STATION_UPDATE_PRIVATE_KEY: ${{ secrets.STATION_UPDATE_PRIVATE_KEY }}
        run: |
          if [[ -z "$STATION_UPDATE_PRIVATE_KEY" ]]; then
            echo "Signing key is not configured. Refusing to publish an unsigned update feed."
            exit 1
          fi
          version="$(node -p 'require("./app/update-config.json").version')"
          node -e 'const fs=require("fs"),path=require("path"); fs.writeFileSync(path.join(process.env.RUNNER_TEMP,"station-update-private.pem"),process.env.STATION_UPDATE_PRIVATE_KEY,{mode:0o600});'
          node app/updater/sign-update.js sign app/update-config.json dist "release-notes/v$version.md" "$RUNNER_TEMP/station-update-private.pem"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./app/update-config.json").version')"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; keeping its uploaded packages."
            exit 0
          fi
          if [[ -f "release-notes/${GITHUB_REF_NAME}.md" ]]; then
            notes=(--notes-file "release-notes/${GITHUB_REF_NAME}.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/Ramin-Station-$version-macOS.dmg" \
            "dist/Ramin-Station-$version-macOS.zip" \
            "dist/Ramin-Station-$version-Windows-Setup.exe" \
            "dist/Ramin-Station-$version-Windows-Portable.zip" \
            dist/SHA256SUMS.txt \
            dist/updates-stable.json \
            --verify-tag \
            --title "Ramin Station ${GITHUB_REF_NAME#v}" \
            "${notes[@]}"
